[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-4-rf"
version = "0.7.0"
description = "Drone 4-RF passive SDR scanner for probable drone RF and EMI activity. Receive-only; never transmits."
readme = "README.md"
# 3.9 floor: live-HackRF use on Windows runs under Python 3.9 because
# PothosSDR (latest build 2021.07.25) ships SoapySDR bindings for 3.9 only.
# Development and simulation work on any modern Python.
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
sdr = [
    # SoapySDR Python bindings are normally installed via the OS package
    # manager (Linux) or the PothosSDR installer (Windows), not pip.
    # This extra is intentionally empty; see README "Installing SoapySDR".
]
fast = ["pyfftw>=0.13"]
gui = ["PyQt6>=6.5", "pyqtgraph>=0.13"]
ml = ["scikit-learn>=1.3"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
drone4rf = "drone4rf.cli:main"

[tool.setuptools.packages.find]
include = ["drone4rf*"]

[tool.setuptools.package-data]
drone4rf = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
